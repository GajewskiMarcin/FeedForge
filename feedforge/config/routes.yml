# Feed Forge - Symfony Routes
# Page routes (render Twig templates)

feedforge_index:
    path: /feedforge/
    methods: [GET]
    defaults:
        _controller: 'FeedForge\Controller\Admin\FeedForgeController::dashboardAction'
        _legacy_controller: AdminFeedForgeDashboard
        _legacy_link: AdminFeedForgeDashboard

feedforge_dashboard:
    path: /feedforge/dashboard
    methods: [GET]
    defaults:
        _controller: 'FeedForge\Controller\Admin\FeedForgeController::dashboardAction'
        _legacy_controller: AdminFeedForgeDashboard
        _legacy_link: AdminFeedForgeDashboard

feedforge_products:
    path: /feedforge/products
    methods: [GET]
    defaults:
        _controller: 'FeedForge\Controller\Admin\FeedForgeController::productsAction'
        _legacy_controller: AdminFeedForgeProducts
        _legacy_link: AdminFeedForgeProducts

feedforge_product_detail:
    path: /feedforge/products/{productId}
    methods: [GET]
    defaults:
        _controller: 'FeedForge\Controller\Admin\FeedForgeController::productDetailAction'
        _legacy_controller: AdminFeedForgeProducts
        _legacy_link: AdminFeedForgeProducts
    requirements:
        productId: '\d+'

feedforge_queue:
    path: /feedforge/queue
    methods: [GET]
    defaults:
        _controller: 'FeedForge\Controller\Admin\FeedForgeController::queueAction'
        _legacy_controller: AdminFeedForgeQueue
        _legacy_link: AdminFeedForgeQueue

feedforge_reports:
    path: /feedforge/reports
    methods: [GET]
    defaults:
        _controller: 'FeedForge\Controller\Admin\FeedForgeController::reportsAction'
        _legacy_controller: AdminFeedForgeReports
        _legacy_link: AdminFeedForgeReports

feedforge_rules:
    path: /feedforge/rules
    methods: [GET]
    defaults:
        _controller: 'FeedForge\Controller\Admin\FeedForgeController::rulesAction'
        _legacy_controller: AdminFeedForgeRules
        _legacy_link: AdminFeedForgeRules

feedforge_config:
    path: /feedforge/config
    methods: [GET]
    defaults:
        _controller: 'FeedForge\Controller\Admin\FeedForgeController::configAction'
        _legacy_controller: AdminFeedForgeConfig
        _legacy_link: AdminFeedForgeConfig

feedforge_support:
    path: /feedforge/support
    methods: [GET]
    defaults:
        _controller: 'FeedForge\Controller\Admin\FeedForgeController::supportAction'
        _legacy_controller: AdminFeedForgeSupport
        _legacy_link: AdminFeedForgeSupport

# Feed edit page (dedicated subpage)

feedforge_feed_new:
    path: /feedforge/feeds/new
    methods: [GET]
    defaults:
        _controller: 'FeedForge\Controller\Admin\FeedForgeController::feedEditAction'
        _legacy_controller: AdminFeedForgeConfig
        _legacy_link: AdminFeedForgeConfig
        feedId: 0

feedforge_feed_edit:
    path: /feedforge/feeds/edit/{feedId}
    methods: [GET]
    defaults:
        _controller: 'FeedForge\Controller\Admin\FeedForgeController::feedEditAction'
        _legacy_controller: AdminFeedForgeConfig
        _legacy_link: AdminFeedForgeConfig
        feedId: 0
    requirements:
        feedId: '\d+'

